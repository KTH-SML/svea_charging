/**:
  ros__parameters:
    # Fixed [x, y] coordinates from /self/odometry/global, in metres.
    # Fully re-recorded by driving the desired path manually (RC, Stanley
    # disabled) and resampling /self/odometry/global every 1m of travelled
    # distance (light smoothing applied first to damp GPS jitter). RTK was
    # carrSoln=2 / hAcc ~1.4cm for the entire recording. Covers straight +
    # right turn only, ending at [55.1364, -21.1698]. The manual recording
    # continued past that into a sharp hook (down to y=-44) that isn't part
    # of the intended route and also fails the curvature check below -
    # trimmed off.
    map_waypoints: "[[0.4685, -0.1614], [1.2611, -0.6187], [2.1161, -0.598], [2.7683, -1.0088], [3.4747, -1.3894], [4.286, -1.418], [4.9541, -1.8591], [5.7264, -2.1787], [6.5737, -2.2548], [7.1206, -2.7396], [7.9392, -3.0468], [8.8064, -3.236], [9.3168, -3.5559], [10.1454, -3.9117], [10.9263, -4.2671], [11.8262, -4.6201], [12.704, -5.0051], [13.5767, -5.2416], [14.3919, -5.5396], [15.1229, -5.9218], [15.9928, -6.2765], [16.9351, -6.596], [17.8638, -6.9612], [18.7728, -7.3765], [19.7056, -7.7358], [20.6253, -8.1269], [21.5442, -8.5199], [22.4444, -8.9504], [23.3735, -9.3159], [24.2862, -9.7229], [25.2073, -10.1114], [26.1627, -10.4038], [27.1317, -10.6428], [28.0849, -10.9422], [29.0352, -11.2457], [29.9471, -11.6532], [30.877, -12.0199], [31.8081, -12.3841], [32.7524, -12.7092], [33.6751, -13.0923], [34.5956, -13.4768], [35.547, -13.778], [36.4753, -14.148], [37.417, -14.4835], [38.3623, -14.8084], [39.2839, -15.1926], [40.2273, -15.518], [41.1574, -15.884], [42.1029, -16.2057], [43.0343, -16.5675], [43.9717, -16.9141], [44.9091, -17.262], [45.8443, -17.6159], [46.793, -17.9316], [47.7269, -18.2815], [48.6738, -18.6002], [49.6389, -18.8417], [50.5856, -19.1522], [51.4989, -19.5556], [52.394, -19.9992], [53.317, -20.3833], [54.247, -20.7239], [55.1364, -21.1698]]"

    target_velocity: 0.20
    turn_velocity: 0.12
    goal_tolerance: 0.75

    # The first waypoint and first route segment define the required start.
    start_tolerance: 1.50
    start_heading_tolerance: 0.50

    # Stop if the vehicle center is farther than this from the spline.
    corridor_width: 1.50

    # Slow down when upcoming spline curvature reaches this value [1/m].
    turn_curvature_threshold: 0.50

    # Reject a generated route containing a tighter bend than this radius [m].
    minimum_turning_radius: 0.40

    odometry_timeout_s: 0.30
    gps_timeout_s: 2.50
    rtk_timeout_s: 2.50
    require_rtk_fixed: true
    rtk_fixed_settle_s: 10.0
    max_horizontal_accuracy: 0.50
    localization_settle_s: 10.0
    max_settle_position_spread: 0.20

    # Outdoor EKF is GPS/encoder-only, so use RTK position deltas as heading
    # for Stanley instead of trusting odometry yaw.
    use_course_heading: true
    course_heading_min_distance: 0.50
    course_heading_alpha: 0.20
